name: CI

# Every push and every pull request gets the same four checks, so a change
# that breaks the site is caught before it reaches production. The checks are
# the ones a developer already runs locally: lint, types, tests, build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push makes the running check irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The version comes from .nvmrc, so the machine, CI and the
          # deployment all read the same number.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `PageProps` and the other route types are generated by Next.js and live
      # in files the repository does not track, so they have to be made before
      # the type check can see them.
      - name: Generate Next.js types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # The build needs no secret: the public dataset can be read without a
      # token, and the pages that need one fall back to the static content.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://melodialam-website.vercel.app

      # Serve the build and ask it the questions a deploy can break quietly:
      # every route answers, the old /journal still redirects, page 2 of
      # Stories exists, the sitemap lists what it should.
      - name: Smoke test the built site
        env:
          NEXT_PUBLIC_SITE_URL: https://melodialam-website.vercel.app
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/api/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs http://localhost:3100

      # The unit tests and the smoke script read the server; this one clicks
      # the parts that only exist after hydration: the Discover filter, the
      # search, and the /kurasi redirect.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser checks
        env:
          NEXT_PUBLIC_SITE_URL: https://melodialam-website.vercel.app
        run: npm run test:e2e
