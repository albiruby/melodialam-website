name: Laporan bug
description: Laporkan perilaku yang rusak atau tidak sesuai.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melapor. Untuk masalah keamanan, **jangan** memakai
        formulir ini — baca [SECURITY.md](../SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: Ringkasan
      description: Apa yang terjadi, dan di halaman atau endpoint mana?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      placeholder: |
        1. Buka ...
        2. Klik ...
        3. Lihat ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Perilaku yang diharapkan
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Lingkungan
      options:
        - Produksi (melodialam-website.vercel.app)
        - Preview deployment
        - Lokal (npm run dev)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Peramban / perangkat
      placeholder: Chrome 141 Windows 11; iPhone 15 Safari

  - type: textarea
    id: evidence
    attributes:
      label: Bukti tambahan
      description: Screenshot, pesan konsol, atau respons jaringan. Jangan sertakan data pribadi.

  - type: checkboxes
    id: checks
    attributes:
      label: Konfirmasi
      options:
        - label: Saya sudah mencari issue yang serupa.
          required: true
        - label: Ini bukan laporan keamanan.
          required: true
