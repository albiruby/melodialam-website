version: 2

# Two things age on their own: the packages this site stands on, and the
# actions the pipeline runs. Both get a weekly pull request, grouped so a
# Monday does not arrive with thirty of them.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      sanity:
        patterns: ["@sanity/*"]
      test:
        patterns: ["vitest", "@vitest/*"]
      minor:
        update-types: ["minor", "patch"]
    ignore:
      # Major jumps need a person: Next, React, TypeScript and ESLint majors
      # each change behaviour the site depends on.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
